[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptflow"
version = "0.1.0"
description = "A scikit-learn compatible Formal Concept Analysis framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Anurag Sharma", email = "sharma@cs.uni-kassel.de" }
]
keywords = [
    "formal-concept-analysis",
    "fca",
    "scikit-learn",
    "concept-lattice",
    "conceptual-scaling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.2",
    "networkx",
    "sympy",
    "z3-solver",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/anuragxorma/conceptflow"
Repository = "https://github.com/anuragxorma/conceptflow"
Issues = "https://github.com/anuragxorma/conceptflow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"conceptflow.visualization.dimflux" = ["LICENSE", "README.md"]
"conceptflow.visualization.dimflux.libs" = ["*.jar"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
